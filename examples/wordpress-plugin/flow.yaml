# examples/wordpress-plugin — a trimmed deliver road for a small
# plugin: spec-gated, ledger-driven build, human shake-out seal.
#
# v2: DERIVED from the full road with `extends:` instead of copied from
# it. The five nodes this example shares with deliver — gate-spec,
# build, gate-ledger, shakeout, gate-acceptance — are inherited now, so
# a fix to the long road reaches this one on the next compile. Copying
# is how the same graph comes to exist in four places, each aging
# separately.
#
# What it changes: no brainstorm (the spec node writes the plan too),
# no plan-approval seal (plugin-sized work), no [HUMAN]-task unblock
# lane — so gate-ledger's non-zero exits all route back to build.
#
# Composition is resolved by flow-lint at COMPILE time; the twin holds
# the complete graph and the walker never learns `extends` exists.

flow: example-wp-plugin
version: 2
extends: deliver

remove:
  - brainstorm          # the spec node writes idea, spec and plan
  - plan                # …so the separate plan stage goes with it
  - gate-plan
  - approve-plan        # plugin-sized: no plan-approval seal
  - gate-approval
  - unblock             # no [HUMAN] task lane on this road

nodes:
  - id: spec            # replaces deliver's spec by id: one agent node
    kind: agent         # produces the whole planning set
    craft: [skills/spec-authoring]
    out: [spec.md, plan.md, tasks.md]

edges:
  # Declaring any edge from a node replaces ALL of the parent's edges
  # from that node — one routing decision, one routing table.
  - {from: __start__,   to: spec}
  - {from: gate-spec,   to: build,    when: gate.exit == 0}
  - {from: gate-spec,   to: spec,     when: gate.exit != 0}
  - {from: gate-ledger, to: shakeout, when: gate.exit == 0}
  - {from: gate-ledger, to: build,    when: gate.exit != 0}
