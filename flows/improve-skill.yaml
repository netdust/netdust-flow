# flows/improve-skill.yaml — the reflexive flow: improve a craft's SKILL
# from the memory of what it got wrong, and let an EVAL decide whether it
# actually got better. netdust-flow turned on its own craft.
#
# The three invariants that keep this from Goodharting itself (see
# docs/craft-loop.md) are wired into the graph, not left to good faith:
#   1. GROUNDED — gate-cover fails unless every live lesson has an eval
#      case that cites it; cases derive from real failures, never invented.
#   2. THE GATE IS THE EVAL — gate-eval (skill-eval) is deterministic and
#      the proposer never sees its assertions while revising. Passing it
#      is the ONLY way forward.
#   3. LOOP IMPROVES THE WORKER, NOT THE REFEREE — this flow touches only
#      the skill (craft); it never edits a gate or a flow. A human seals
#      the adopted skill, and a SEPARATE verifier-driven pruner (not the
#      proposer) retires a lesson only when its case truly passes.
#
# The un-gameable outer check lives outside this flow: after adoption,
# flow-eval must show the live domain cohort actually improving. If the
# skill-eval soars but real reject-rate does not drop, that is Goodhart —
# caught there, not here.
#
# Binds (set at arm time): netdust_flow, skill (name), skill_dir,
# feature_dir (a run to harvest lessons from), memory_root, eval_outputs
# (path the proposer writes its per-case outputs to).

flow: improve-skill
version: 1

state:
  gate: {}

nodes:
  - id: propose            # read live lessons for {skill}; revise
    kind: agent            # {skill_dir}/SKILL.md; ensure eval/cases.jsonl
    craft:                 # covers every live lesson; run the CANDIDATE
      - agents/skill-tuner # skill on each case → write {eval_outputs}
      - skills/craft-curation
    in: [craft memory, SKILL.md]
    out: [SKILL.md, eval/cases.jsonl, "{eval_outputs}"]

  - id: gate-cover         # GROUNDING: every live lesson has a case that
    kind: gate             # cites it — no unmeasured claims
    run: "{netdust_flow}/bin/craft-memory.py --root {memory_root} cover {skill} --skill-dir {skill_dir}"

  - id: gate-eval          # CAPABILITY: the deterministic, grounded gate —
    kind: gate             # every case passes on the candidate, or loop
    run: "{netdust_flow}/bin/skill-eval.py {skill_dir} --outputs {eval_outputs}"

  - id: review             # fresh context: is it coherent, or overfit to
    kind: agent            # the cases? verdict tree-bound (I5)
    craft: [agents/reviewer]
    in: [SKILL.md]
    out: [reviews/skill.md]

  - id: gate-review
    kind: gate
    run: "{netdust_flow}/bin/review-check.py {skill_dir} skill"

  - id: approve            # yield: a human ADOPTS the skill change — the
    kind: human            # loop proposes and measures, the human decides
    out: [seal skill-adopt]

  - id: gate-approval      # reads the decision, bound to the current tree
    kind: gate             # (--fresh: a drifted skill re-asks)
    run: "{netdust_flow}/bin/seal.py check {skill_dir} skill-adopt --fresh"

  - id: prune              # verifier-driven cleaning: RE-RUN the eval and
    kind: gate             # retire only lessons whose case truly passes.
    run: "{netdust_flow}/bin/craft-memory.py --root {memory_root} prune {skill} --skill-dir {skill_dir} --outputs {eval_outputs}"
    # gate-eval already proved every case green, so by here the cased
    # lessons all pass and are retired; any remaining live lesson has no
    # case (human-judged, tone/nuance) and is the seal's business, not
    # this loop's. One arming = one improvement cycle; new lessons take a
    # new run.

edges:
  - {from: __start__,      to: propose}
  - {from: propose,        to: gate-cover}
  - {from: gate-cover,     to: gate-eval,   when: gate.exit == 0}
  - {from: gate-cover,     to: propose,     when: gate.exit != 0}
  - {from: gate-eval,      to: review,      when: gate.exit == 0}
  - {from: gate-eval,      to: propose,     when: gate.exit != 0}
  - {from: review,         to: gate-review}
  - {from: gate-review,    to: approve,     when: gate.exit == 0}
  - {from: gate-review,    to: propose,     when: gate.exit != 0}
  - {from: approve,        to: gate-approval}
  - {from: gate-approval,  to: prune,       when: gate.exit == 0}
  - {from: gate-approval,  to: propose,     when: gate.exit == 2}
  - {from: gate-approval,  to: approve,     when: gate.exit == 1}
  - {from: prune,          to: __end__,     when: gate.exit == 0}
  - {from: prune,          to: propose,     when: gate.exit != 0}
